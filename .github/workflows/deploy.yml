name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Restore the last successful metrics snapshot
        uses: actions/cache/restore@v4
        with:
          path: src/data/generated/metrics.json
          key: metrics-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            metrics-${{ github.ref_name }}-

      - name: Install dependencies
        run: npm ci

      - name: Refresh build-time metrics
        run: npm run metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

      - name: Run Astro and TypeScript checks
        run: npm run check

      - name: Build static site
        run: npm run build:site

      - name: Save the successful metrics snapshot
        uses: actions/cache/save@v4
        with:
          path: src/data/generated/metrics.json
          key: metrics-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
