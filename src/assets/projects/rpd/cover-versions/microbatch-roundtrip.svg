<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="pipedream-cover-title pipedream-cover-description">
  <title id="pipedream-cover-title">PipeDream microbatch round-trip concept</title>
  <desc id="pipedream-cover-description">A microbatch moves forward through four pipeline stages and backward again. The widening intervals between matching forward and backward operations show weight stashing delay, with the steady-state worst-stage delay shown below.</desc>

  <defs>
    <linearGradient id="forward-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#365bc8"/>
      <stop offset="1" stop-color="#6a70e4"/>
    </linearGradient>
    <linearGradient id="backward-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ef9a50"/>
      <stop offset="1" stop-color="#df6f60"/>
    </linearGradient>
    <linearGradient id="stash-fill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e8ecff"/>
      <stop offset="0.5" stop-color="#f1efff"/>
      <stop offset="1" stop-color="#fff0e8"/>
    </linearGradient>
    <filter id="node-shadow" x="-45%" y="-45%" width="190%" height="210%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#27345d" flood-opacity="0.14"/>
    </filter>
    <filter id="result-shadow" x="-30%" y="-45%" width="160%" height="210%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4059ce" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="102" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="760" letter-spacing="4.6" fill="#0d1526">PIPEDREAM</text>
  <text x="800" y="149" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="2.5" fill="#66738a">PIPELINE SPEED · STALE-WEIGHT THEORY</text>

  <!-- Time runs left to right while one microbatch descends and returns through the stages. -->
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="1128" y="193" font-size="15" font-weight="700" letter-spacing="2" fill="#8490a4">TIME</text>
    <path d="M1190 188H1330M1319 178L1330 188L1319 198" fill="none" stroke="#aab3c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#fafbfe" stroke="#edf0f6" stroke-width="2">
      <rect x="240" y="210" width="1120" height="94" rx="28"/>
      <rect x="240" y="320" width="1120" height="94" rx="28"/>
      <rect x="240" y="430" width="1120" height="94" rx="28"/>
      <rect x="240" y="540" width="1120" height="94" rx="28"/>
    </g>

    <g font-size="18" font-weight="750" letter-spacing="1.8" fill="#657188" text-anchor="end">
      <text x="207" y="264">STAGE 1</text>
      <text x="207" y="374">STAGE 2</text>
      <text x="207" y="484">STAGE 3</text>
      <text x="207" y="594">STAGE 4</text>
    </g>
  </g>

  <!-- Each band is the lifetime of the version saved at forward and reused at backward. -->
  <g fill="url(#stash-fill)" stroke="#d9ddf2" stroke-width="2">
    <rect x="300" y="246" width="1000" height="22" rx="11"/>
    <rect x="440" y="356" width="720" height="22" rx="11"/>
    <rect x="580" y="466" width="440" height="22" rx="11"/>
    <rect x="720" y="576" width="160" height="22" rx="11"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#68748a">
    <text x="800" y="263">w<tspan baseline-shift="super" font-size="12">(1)</tspan></text>
    <text x="800" y="373">w<tspan baseline-shift="super" font-size="12">(2)</tspan></text>
    <text x="800" y="483">w<tspan baseline-shift="super" font-size="12">(3)</tspan></text>
  </g>

  <!-- The same microbatch: forward in blue, loss at the turn, backward in orange. -->
  <path d="M300 257L440 367L580 477L720 587L800 587" fill="none" stroke="#5269d9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>
  <path d="M800 587H880L1020 477L1160 367L1300 257" fill="none" stroke="#e58655" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>

  <g filter="url(#node-shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g fill="url(#forward-fill)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2">
      <rect x="264" y="221" width="72" height="72" rx="20"/>
      <rect x="404" y="331" width="72" height="72" rx="20"/>
      <rect x="544" y="441" width="72" height="72" rx="20"/>
      <rect x="684" y="551" width="72" height="72" rx="20"/>
    </g>
    <g fill="#ffffff" font-size="29" font-weight="760">
      <text x="300" y="267">F</text>
      <text x="440" y="377">F</text>
      <text x="580" y="487">F</text>
      <text x="720" y="597">F</text>
    </g>

    <g fill="url(#backward-fill)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2">
      <rect x="844" y="551" width="72" height="72" rx="20"/>
      <rect x="984" y="441" width="72" height="72" rx="20"/>
      <rect x="1124" y="331" width="72" height="72" rx="20"/>
      <rect x="1264" y="221" width="72" height="72" rx="20"/>
    </g>
    <g fill="#ffffff" font-size="29" font-weight="760">
      <text x="880" y="597">B</text>
      <text x="1020" y="487">B</text>
      <text x="1160" y="377">B</text>
      <text x="1300" y="267">B</text>
    </g>
  </g>

  <g filter="url(#node-shadow)">
    <circle cx="800" cy="587" r="31" fill="#ffffff" stroke="#7475d9" stroke-width="4"/>
    <text x="800" y="593" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" fill="#5965bd">LOSS</text>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">
    <rect x="425" y="655" width="18" height="18" rx="5" fill="#5269d9"/>
    <text x="457" y="670" fill="#5c6880">FORWARD</text>
    <rect x="626" y="655" width="18" height="18" rx="5" fill="#e58655"/>
    <text x="658" y="670" fill="#5c6880">BACKWARD</text>
    <rect x="842" y="655" width="54" height="18" rx="9" fill="url(#stash-fill)" stroke="#d9ddf2" stroke-width="2"/>
    <text x="911" y="670" fill="#5c6880">STASHED WEIGHT VERSION</text>
  </g>

  <!-- The scheduler-induced delay obtained in the paper. -->
  <g filter="url(#result-shadow)">
    <rect x="557" y="716" width="486" height="132" rx="32" fill="#ffffff" stroke="#e1e5f0" stroke-width="2.5"/>
  </g>
  <text x="800" y="757" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="750" letter-spacing="2.2" fill="#738097">STEADY-STATE WORST-STAGE DELAY · EVEN S</text>
  <text x="800" y="821" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-style="italic" fill="#26324a">δ<tspan baseline-shift="sub" font-size="24">PD</tspan><tspan baseline-shift="baseline" font-style="normal"> = </tspan><tspan baseline-shift="baseline">S</tspan><tspan baseline-shift="super" font-size="27">2</tspan><tspan baseline-shift="baseline" font-style="normal"> − </tspan><tspan baseline-shift="baseline">S</tspan><tspan baseline-shift="baseline" font-style="normal">/2</tspan></text>
</svg>
