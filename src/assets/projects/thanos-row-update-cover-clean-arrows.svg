<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="thanos-cover-title thanos-cover-description">
  <title id="thanos-cover-title">Thanos current-block row reconstruction</title>
  <desc id="thanos-cover-description">A joint Thanos update leaves previously processed weights on the left unchanged, removes two selected weights in the current block, and updates the current block and all weights to its right.</desc>

  <defs>
    <linearGradient id="updated-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2faf5"/>
      <stop offset="1" stop-color="#e2f3e9"/>
    </linearGradient>
    <filter id="formula-shadow" x="-20%" y="-35%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4059ce" flood-opacity="0.10"/>
    </filter>
    <filter id="row-shadow" x="-25%" y="-30%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#24314a" flood-opacity="0.08"/>
    </filter>
    <marker id="green-arrow" viewBox="0 0 18 18" refX="11" refY="9" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L16 9L2 16Z" fill="#4f9a73" stroke="#4f9a73" stroke-width="2" stroke-linejoin="round"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 18 18" refX="11" refY="9" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L16 9L2 16Z" fill="#df6f60" stroke="#df6f60" stroke-width="2" stroke-linejoin="round"/>
    </marker>
    <g id="updated-cell">
      <rect width="72" height="72" rx="18" fill="url(#updated-fill)" stroke="#72ad8b" stroke-width="3"/>
      <path d="M23 36H49M42 29L49 36L42 43" fill="none" stroke="#3c8863" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="removed-cell">
      <rect width="72" height="72" rx="18" fill="#fff3ef" stroke="#df7567" stroke-width="3.5"/>
      <path d="M24 24L48 48M48 24L24 48" fill="none" stroke="#df6f60" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="unchanged-cell">
      <rect width="72" height="72" rx="18" fill="#f1f3f6" stroke="#d9dee7" stroke-width="3"/>
      <circle cx="36" cy="36" r="5" fill="#bcc5d2"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="108" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="760" letter-spacing="5" fill="#0d1526">THANOS</text>
  <text x="800" y="155" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="2.8" fill="#66738a">JOINT ROW RECONSTRUCTION</text>

  <g filter="url(#formula-shadow)">
    <rect x="526" y="213" width="548" height="114" rx="30" fill="#ffffff" stroke="#e2e6f1" stroke-width="2.5"/>
  </g>

  <!-- The joint solve drives both deletion and compensation in one row. -->
  <path d="M800 327V382" fill="none" stroke="#5267d0" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="800" cy="388" r="7" fill="#5267d0"/>

  <!-- Previously processed weights sit to the left of the current block. -->
  <rect x="558" y="516" width="388" height="140" rx="30" fill="#f6f6ff" stroke="#e2e5f6" stroke-width="2"/>

  <!-- Arrows stay above the block background and stop before the cells. -->
  <g fill="none" stroke="#4f9a73" stroke-width="4.5" stroke-linecap="round" opacity="0.84" marker-end="url(#green-arrow)">
    <path d="M800 388Q704 422 608 532"/>
    <path d="M800 388V532"/>
    <path d="M800 388Q896 422 992 536"/>
    <path d="M800 388Q944 423 1088 536"/>
    <path d="M800 388Q992 424 1184 536"/>
    <path d="M800 388Q1040 424 1280 536"/>
  </g>
  <g fill="none" stroke="#df6f60" stroke-width="5.2" stroke-linecap="round" opacity="0.96" marker-end="url(#red-arrow)">
    <path d="M800 388Q752 420 704 532"/>
    <path d="M800 388Q848 420 896 532"/>
  </g>

  <!-- Red coordinates are zeroed; green coordinates are updated; gray coordinates stay frozen. -->
  <g filter="url(#row-shadow)">
    <use href="#unchanged-cell" x="188" y="550"/>
    <use href="#unchanged-cell" x="284" y="550"/>
    <use href="#unchanged-cell" x="380" y="550"/>
    <use href="#unchanged-cell" x="476" y="550"/>
    <use href="#updated-cell" x="572" y="550"/>
    <use href="#removed-cell" x="668" y="550"/>
    <use href="#updated-cell" x="764" y="550"/>
    <use href="#removed-cell" x="860" y="550"/>
    <use href="#updated-cell" x="956" y="550"/>
    <use href="#updated-cell" x="1052" y="550"/>
    <use href="#updated-cell" x="1148" y="550"/>
    <use href="#updated-cell" x="1244" y="550"/>
  </g>

  <text x="752" y="646" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2.1" fill="#5267d0">CURRENT BLOCK</text>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="1.7">
    <rect x="300" y="690" width="38" height="38" rx="10" fill="#f1f3f6" stroke="#d9dee7" stroke-width="3"/>
    <circle cx="319" cy="709" r="5" fill="#bcc5d2"/>
    <text x="354" y="716" fill="#748097">UNCHANGED</text>

    <rect x="585" y="690" width="38" height="38" rx="10" fill="#fff3ef" stroke="#df7567" stroke-width="3"/>
    <path d="M596 701L612 717M612 701L596 717" fill="none" stroke="#df6f60" stroke-width="4.5" stroke-linecap="round"/>
    <text x="639" y="716" fill="#7a5360">SELECTED → ZERO</text>

    <rect x="900" y="690" width="38" height="38" rx="10" fill="#e8f5ed" stroke="#72ad8b" stroke-width="3"/>
    <path d="M909 709H929M923 703L929 709L923 715" fill="none" stroke="#3c8863" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="954" y="716" fill="#47745e">UPDATED: BLOCK + RIGHT</text>
  </g>

